# Configuración de Producción para Render
spring.application.name=SGTurnos

# Database Configuration (Variables de entorno de Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS permitir frontend
cors.allowed.origins=${FRONTEND_URL:https://sgturnos-frontend.onrender.com}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Rutas de almacenamiento
malla.storage.path=${MALLA_STORAGE_PATH:./mallas}
soporte.storage.path=${SOPORTE_STORAGE_PATH:./uploads/soportes}

# Server Configuration
server.port=${PORT:8085}

# Flyway deshabilitado
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sgturnos=DEBUG
